# host-controlled LED bits (Num/Caps/Scroll/Compose/Kana) via the HID LED report
CONFIG_ZMK_HID_INDICATORS=y
# the LEDs are indicators (mnt,led-indicators in the keymap), not underglow
CONFIG_ZMK_RGB_UNDERGLOW=n
# host LED control over zmk-raw-hid, a second HID interface (own hidraw node)
CONFIG_RAW_HID=y
CONFIG_USB_HID_DEVICE_COUNT=2
